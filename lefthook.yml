pre-commit:
  parallel: true
  commands:
    lint:
      run: pnpm -r --if-present lint
    typecheck:
      run: pnpm -r --if-present typecheck
    gitleaks:
      run: npx --yes gitleaks detect --staged --config .gitleaks.toml

pre-push:
  commands:
    block-main:
      run: bash scripts/block-main.sh