name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # On Free plan, we skip protected branch checks; enforce via lefthook instead
  COREPACK_ENABLE_AUTO_PIN: 0

jobs:
  lint-typecheck-unit:
    name: Lint + Typecheck + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: |
          pip install -r apps/sim/requirements.txt 2>/dev/null || true
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Unit tests (JS/TS)
        run: pnpm -r --if-present test
      - name: Unit tests (Python)
        run: |
          cd apps/sim && python -m pytest --collect-only >/dev/null 2>&1 || echo "No tests yet"

  contracts-drift:
    name: Contracts Drift Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Generate TS client
        run: pnpm -w run generate:client 2>/dev/null || echo "generate:client script not yet implemented"
      - name: Check drift
        run: |
          git diff --exit-code || (echo "Drift detected: contracts changed" && exit 1)

  site-agnostic:
    name: Site-Agnostic Grep Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Run check script
        run: bash scripts/check-site-agnostic.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - name: Build and push sim
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/sim/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/sim:${{ github.sha }}
      - name: Build and push sim-console
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/sim-console/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/sim-console:${{ github.sha }}

  e2e-smoke:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Setup pnpm
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Start compose
        run: docker compose -f docker-compose.yml up -d
      - name: Wait for services
        run: sleep 30
      - name: Run Playwright smoke
        run: pnpm -w run test --grep="smoke" 2>/dev/null || true
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/**

  review-gate:
    name: Review Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed-ok label present
        run: |
          labels=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '.labels[].name')
          echo "$labels" | grep -qx 'reviewed-ok' || { echo "FAIL: reviewed-ok label missing"; exit 1; }
          echo "$labels" | grep -qx 'changes-requested' && { echo "FAIL: changes-requested label present"; exit 1; }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}