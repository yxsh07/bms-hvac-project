version: '3.9'

services:
  timescaledb:
    image: timescale/timescaledb:2.13-pg15
    container_name: timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["coarse"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_STORE_DSN=postgres://postgres:password@timescaledb:5432/app_store
      - SITE_STORE_DSN=postgres://postgres:password@timescaledb:5432/site_store
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: ["coarse"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: ["coarse"]

  sim:
    build:
      context: .
      dockerfile: apps/sim/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SITE_STORE_DSN=postgres://postgres:password@timescaledb:5432/site_store
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: ["coarse"]

  sim-console:
    build:
      context: .
      dockerfile: apps/sim-console/Dockerfile
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=production
      - VITE_SIM_URL=http://localhost:8000
    depends_on:
      - sim
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles: ["coarse"]